name: Release

#
# release-please derives the next version from the Conventional Commit subjects
# since the last tag, keeps a release pull request open with the changelog, and
# publishes the tag and the GitHub release when that pull request is merged.
#
# The formula bump stays in this workflow rather than listening for
# "release: published": a release created with GITHUB_TOKEN does not trigger
# other workflows, so a separate workflow would look correct and never run.
#
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

env:
  TAP_REPOSITORY: CodingSteve01/homebrew-tap
  FORMULA_PATH: Formula/git-cleanup-assistant.rb
  SCRIPT_PATH: bin/git-cleanup-assistant

jobs:
  release-please:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    outputs:
      released: ${{ steps.release.outputs.releases_created }}
      tag: ${{ steps.release.outputs.tag_name }}

    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  bump:
    needs: [release-please]

    if: needs.release-please.outputs.released == 'true'

    runs-on: ubuntu-latest

    steps:
      - name: Check out the released tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          path: source

      #
      # The assistant reports its own version in its update check, so a release
      # whose constant does not match the tag would tell every user that they are
      # already up to date. release-please writes the constant itself, which makes
      # this a check on the annotation rather than on anybody's discipline.
      #
      - name: Verify the version constant
        env:
          TAG: ${{ needs.release-please.outputs.tag }}
        run: |
          set -euo pipefail

          declared="$(
            sed -n 's/^VERSION="\([^"]*\)".*$/\1/p' "source/$SCRIPT_PATH"
          )"

          test -n "$declared" || {
            echo "No VERSION constant found in $SCRIPT_PATH." >&2
            exit 1
          }

          if [ "$declared" != "${TAG#v}" ]; then
            echo "VERSION is '$declared' but the tag is '$TAG'." >&2
            echo "Check the x-release-please-version annotation." >&2
            exit 1
          fi

          echo "VERSION matches $TAG."

      - name: Resolve release and checksum
        id: source
        env:
          TAG: ${{ needs.release-please.outputs.tag }}
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          case "$TAG" in
            v[0-9]*) ;;
            *) echo "Unexpected tag '$TAG', expected something like v1.2.3." >&2; exit 1 ;;
          esac

          url="https://github.com/$SOURCE_REPOSITORY/archive/refs/tags/$TAG.tar.gz"

          curl -fsSL --retry 3 -o release.tar.gz "$url"
          sha="$(sha256sum release.tar.gz | cut -d ' ' -f 1)"

          {
            echo "version=${TAG#v}"
            echo "url=$url"
            echo "sha=$sha"
          } >> "$GITHUB_OUTPUT"

      - name: Mint a short lived tap token
        id: tap_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.TAP_BUMP_APP_ID }}
          private-key: ${{ secrets.TAP_BUMP_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: homebrew-tap

      - name: Check out the tap
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TAP_REPOSITORY }}
          token: ${{ steps.tap_token.outputs.token }}
          path: tap

      - name: Rewrite url and sha256
        env:
          FORMULA: tap/${{ env.FORMULA_PATH }}
          URL: ${{ steps.source.outputs.url }}
          SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail

          test -f "$FORMULA" || { echo "Formula '$FORMULA' not found." >&2; exit 1; }

          python3 - <<'PY'
          import os
          import re

          path = os.environ["FORMULA"]
          source = open(path, encoding="utf-8").read()

          for field, value in (("url", os.environ["URL"]), ("sha256", os.environ["SHA"])):
              pattern = rf'^(\s*{field}\s+)"[^"]*"$'
              source, count = re.subn(
                  pattern,
                  lambda match: f'{match.group(1)}"{value}"',
                  source,
                  count=1,
                  flags=re.MULTILINE,
              )
              if count != 1:
                  raise SystemExit(f"Expected exactly one '{field}' line, replaced {count}.")

          open(path, "w", encoding="utf-8").write(source)
          PY

          grep -q "\"$URL\"" "$FORMULA"
          grep -q "\"$SHA\"" "$FORMULA"

      - name: Resolve the bot identity
        id: bot
        env:
          GH_TOKEN: ${{ steps.tap_token.outputs.token }}
          BOT_SLUG: ${{ steps.tap_token.outputs.app-slug }}
        run: |
          set -euo pipefail

          id="$(gh api "/users/$BOT_SLUG%5Bbot%5D" --jq .id)"
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        working-directory: tap
        env:
          VERSION: ${{ steps.source.outputs.version }}
          BOT_NAME: ${{ steps.tap_token.outputs.app-slug }}[bot]
          BOT_ID: ${{ steps.bot.outputs.id }}
        run: |
          set -euo pipefail

          if git diff --quiet; then
            echo "Formula is already at this version, nothing to do."
            exit 0
          fi

          git config user.name "$BOT_NAME"
          git config user.email "$BOT_ID+$BOT_NAME@users.noreply.github.com"
          git commit -am "git-cleanup-assistant $VERSION"
          git push
