name: Release

#
# The repository had only the second half of this pipeline: a release, once
# published by hand, bumped the Homebrew formula. Nothing ever created that
# release, so merging to main produced no version at all.
#
# The VERSION constant in bin/git-cleanup-assistant is the single source of
# truth. Raise it in the pull request; merging it publishes the tag, the release
# and the formula bump.
#
# Tagging and bumping live in one workflow on purpose. A release created with
# GITHUB_TOKEN does not trigger other workflows, so a separate bump workflow
# listening for "release: published" would silently never run.
#
on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to (re)publish, for example v0.2.0"
        required: false

permissions: {}

env:
  TAP_REPOSITORY: CodingSteve01/homebrew-tap
  FORMULA_PATH: Formula/git-cleanup-assistant.rb
  SCRIPT_PATH: bin/git-cleanup-assistant

jobs:
  release:
    # A manually published release is already the thing this job creates.
    if: github.event_name != 'release'

    runs-on: ubuntu-latest

    permissions:
      contents: write

    outputs:
      tag: ${{ steps.version.outputs.tag }}
      created: ${{ steps.publish.outputs.created }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve the version to release
        id: version
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          declared="$(sed -n 's/^VERSION="\(.*\)"$/\1/p' "$SCRIPT_PATH")"

          test -n "$declared" || {
            echo "No VERSION constant found in $SCRIPT_PATH." >&2
            exit 1
          }

          tag="v$declared"

          #
          # A dispatch may name a tag explicitly, but it still has to agree with
          # the script. The assistant reports its own version in the update
          # check, so a release whose constant lags behind the tag would tell
          # every user that they are already up to date.
          #
          if [ -n "$REQUESTED_TAG" ] && [ "$REQUESTED_TAG" != "$tag" ]; then
            echo "Requested '$REQUESTED_TAG' but VERSION says '$declared'." >&2
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Resolved $tag from VERSION."

      - name: Publish the release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail

          #
          # Merges that do not raise VERSION are the normal case, so an existing
          # tag ends the run quietly instead of failing it.
          #
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "created=false" >> "$GITHUB_OUTPUT"
            echo "$TAG is already released; nothing to do."
            exit 0
          fi

          if git rev-parse --verify "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG exists without a release; publish it by hand." >&2
            exit 1
          fi

          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes

          echo "created=true" >> "$GITHUB_OUTPUT"

  bump:
    needs: [release]

    # Runs for a release this workflow just cut, and for one published by hand.
    if: |
      always() &&
      (needs.release.outputs.created == 'true' || github.event_name == 'release')

    runs-on: ubuntu-latest

    steps:
      - name: Resolve release and checksum
        id: source
        env:
          TAG: ${{ needs.release.outputs.tag || github.event.release.tag_name }}
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          case "$TAG" in
            v[0-9]*) ;;
            *) echo "Unexpected tag '$TAG', expected something like v1.2.3." >&2; exit 1 ;;
          esac

          url="https://github.com/$SOURCE_REPOSITORY/archive/refs/tags/$TAG.tar.gz"

          curl -fsSL --retry 3 -o release.tar.gz "$url"
          sha="$(sha256sum release.tar.gz | cut -d ' ' -f 1)"

          {
            echo "version=${TAG#v}"
            echo "url=$url"
            echo "sha=$sha"
          } >> "$GITHUB_OUTPUT"

      - name: Mint a short lived tap token
        id: tap_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.TAP_BUMP_APP_ID }}
          private-key: ${{ secrets.TAP_BUMP_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: homebrew-tap

      - name: Check out the tap
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TAP_REPOSITORY }}
          token: ${{ steps.tap_token.outputs.token }}
          path: tap

      - name: Rewrite url and sha256
        env:
          FORMULA: tap/${{ env.FORMULA_PATH }}
          URL: ${{ steps.source.outputs.url }}
          SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail

          test -f "$FORMULA" || { echo "Formula '$FORMULA' not found." >&2; exit 1; }

          python3 - <<'PY'
          import os
          import re

          path = os.environ["FORMULA"]
          source = open(path, encoding="utf-8").read()

          for field, value in (("url", os.environ["URL"]), ("sha256", os.environ["SHA"])):
              pattern = rf'^(\s*{field}\s+)"[^"]*"$'
              source, count = re.subn(
                  pattern,
                  lambda match: f'{match.group(1)}"{value}"',
                  source,
                  count=1,
                  flags=re.MULTILINE,
              )
              if count != 1:
                  raise SystemExit(f"Expected exactly one '{field}' line, replaced {count}.")

          open(path, "w", encoding="utf-8").write(source)
          PY

          grep -q "\"$URL\"" "$FORMULA"
          grep -q "\"$SHA\"" "$FORMULA"

      - name: Resolve the bot identity
        id: bot
        env:
          GH_TOKEN: ${{ steps.tap_token.outputs.token }}
          BOT_SLUG: ${{ steps.tap_token.outputs.app-slug }}
        run: |
          set -euo pipefail

          id="$(gh api "/users/$BOT_SLUG%5Bbot%5D" --jq .id)"
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        working-directory: tap
        env:
          VERSION: ${{ steps.source.outputs.version }}
          BOT_NAME: ${{ steps.tap_token.outputs.app-slug }}[bot]
          BOT_ID: ${{ steps.bot.outputs.id }}
        run: |
          set -euo pipefail

          if git diff --quiet; then
            echo "Formula is already at this version, nothing to do."
            exit 0
          fi

          git config user.name "$BOT_NAME"
          git config user.email "$BOT_ID+$BOT_NAME@users.noreply.github.com"
          git commit -am "git-cleanup-assistant $VERSION"
          git push
